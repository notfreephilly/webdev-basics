<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmerr</title>
    <link rel="stylesheet" href="/lvl-1/styles.css">
    <script src="https://kit.fontawesome.com/6bfe87094e.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav class="nav-container">
        <h1><a href="index.html">Filmerr</a></h1>
        <div class="nav-btns-left">
            <button>New</button>
            <button>Popular</button>
            <button>Watch</button>
            <div class="dropdown-left">
                <button class="dropbtn-left">Categories <i class="fa-solid fa-caret-down"></i></button>
                <div class="dropdown-content-left">
                    <a href="">Action</a>
                    <a href="">Adventure & Survival</a>
                    <a href="">Comedy</a>
                    <a href="">Crime</a>
                    <a href="">Documentaries</a>
                    <a href="">Drama</a>
                    <a href="">Fantasy & Sci-Fi</a>
                    <a href="">Horror</a>
                    <a href="">Reality</a>
                    <a href="">Anime</a>
                </div>
            </div>
            <span>|</span>
            <button>News</button>
            <button>Shop</button>
        </div>

        <div class="nav-btns-right">
            <a href=""><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href=""><i class="fa-regular fa-star"></i></a>
            <div class="dropdown-right">
                <button class="dropbtn-img profile"><img src="" alt=""></button>
                <p id="profile-name">Philip</p>
                <div class="profile-content">
                    <div class="profiles">
                        <div class="profile1">
                            <button class="profile btn"><img src="" alt=""></button>
                            <p id="profile-name">Randy</p>
                        </div>
                        <div class="profile2">
                            <button class="profile btn"><img src="" alt="">Bubba</button>
                            <p id="profile-name">Bubbaz</p>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <button class="btn">Manage Profiles</button>
                    <button class="btn">Settings</button>
                    <button class="btn">Account</button>
                    <button class="btn">Subscription</button>
                    <button class="btn">Privacy & Legal</button>
                    <button class="btn">Help</button>
                    <button class="btn">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>
</body>

</html>
